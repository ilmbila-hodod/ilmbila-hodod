<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | علم بلا حدود</title>

  <style>
    :root {
      --black: #111111;
      --dark: #1b1b1b;
      --green: #417505;
      --green-light: #eef5e8;
      --gray: #777;
      --light: #f5f6f8;
      --white: #ffffff;
      --border: #e4e4e4;
      --red: #c62828;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(65,117,5,0.08), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(65,117,5,0.07), transparent 30%),
        var(--light);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
      overflow-x: hidden;
    }

    .auth-page {
      width: 100%;
      max-width: 480px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 30px;
      color: var(--green);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .brand p {
      color: var(--gray);
      font-size: 14px;
    }

    .auth-card {
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.9);
      border-radius: 28px;
      padding: 35px 30px;
      box-shadow:
        0 25px 60px rgba(0,0,0,0.08),
        inset 0 1px 0 rgba(255,255,255,0.9);
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(65,117,5,0.07);
      top: -100px;
      right: -80px;
    }

    .auth-card::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(65,117,5,0.05);
      bottom: -90px;
      left: -70px;
    }

    .switch {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f0f1f2;
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 30px;
    }

    .switch button {
      border: none;
      background: transparent;
      padding: 12px 8px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      color: #777;
      cursor: pointer;
      transition: 0.3s;
    }

    .switch button.active {
      background: var(--green);
      color: white;
      box-shadow: 0 5px 15px rgba(65,117,5,0.22);
    }

    .form-box {
      position: relative;
      z-index: 2;
    }

    .form-box h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 6px;
    }

    .form-subtitle {
      text-align: center;
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .input-box {
      position: relative;
    }

    .input-box span {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      opacity: 0.65;
      pointer-events: none;
    }

    .input-box input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #fafafa;
      padding: 0 45px 0 14px;
      font-family: inherit;
      font-size: 14px;
      transition: 0.3s;
    }

    .input-box input:focus {
      border-color: var(--green);
      background: white;
      box-shadow: 0 0 0 4px rgba(65,117,5,0.08);
    }

    .input-box input::placeholder {
      color: #aaa;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 3px 0 20px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #777;
      cursor: pointer;
    }

    .remember input {
      accent-color: var(--green);
    }

    .forgot {
      color: var(--green);
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(65,117,5,0.18);
    }

    .submit-btn:hover {
      background: #345f04;
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(65,117,5,0.25);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      line-height: 1.7;
    }

    .message.success {
      display: block;
      background: #eef8e8;
      color: #356504;
      border: 1px solid #d5e9c8;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: var(--red);
      border: 1px solid #f2cccc;
    }

    .bottom-text {
      text-align: center;
      margin-top: 20px;
      color: var(--gray);
      font-size: 14px;
    }

    .bottom-text button {
      border: none;
      background: none;
      color: var(--green);
      font-family: inherit;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .home-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 13px;
      transition: 0.3s;
      text-decoration: none;
    }

    .home-link:hover {
      color: var(--green);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 500px) {
      body {
        padding: 18px 12px;
      }

      .brand h1 {
        font-size: 26px;
      }

      .auth-card {
        padding: 25px 20px;
        border-radius: 23px;
      }

      .form-box h2 {
        font-size: 25px;
      }

      .switch button {
        font-size: 14px;
      }

      .options {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="auth-page">

    <div class="brand">
      <h1>علم بلا حدود</h1>
      <p>تعلم، اكتشف، ووسّع معرفتك</p>
    </div>

    <section class="auth-card">

      <div class="switch">

        <button id="loginTab" class="active" onclick="showLogin()">
          تسجيل الدخول
        </button>

        <button id="signupTab" onclick="showSignup()">
          إنشاء حساب
        </button>

      </div>

      <!-- الرسائل -->

      <div id="message" class="message"></div>


      <!-- =========================
           تسجيل الدخول
      ========================== -->

      <div id="loginForm" class="form-box">

        <h2>مرحبًا بعودتك</h2>

        <p class="form-subtitle">
          سجّل الدخول للوصول إلى حسابك
        </p>

        <div class="field">

          <label>البريد الإلكتروني</label>

          <div class="input-box">

            <span>✉️</span>

            <input
              type="email"
              id="loginEmail"
              placeholder="example@email.com"
              autocomplete="email"
            >

          </div>

        </div>

        <div class="field">

          <label>كلمة المرور</label>

          <div class="input-box">

            <span>🔒</span>

            <input
              type="password"
              id="loginPassword"
              placeholder="أدخل كلمة المرور"
              autocomplete="current-password"
            >

          </div>

        </div>

        <div class="options">

          <label class="remember">

            <input
              type="checkbox"
              id="rememberMe"
            >

            تذكرني

          </label>

          <span
            class="forgot"
            onclick="forgotPassword()"
          >
            نسيت كلمة المرور؟
          </span>

        </div>

        <button
          class="submit-btn"
          id="loginButton"
          type="button"
          onclick="loginUser()"
        >
          تسجيل الدخول
        </button>

        <div class="bottom-text">

          ليس لديك حساب؟

          <button onclick="showSignup()">
            إنشاء حساب
          </button>

        </div>

      </div>


      <!-- =========================
           إنشاء الحساب
      ========================== -->

      <div id="signupForm" class="form-box hidden">

        <h2>إنشاء حساب</h2>

        <p class="form-subtitle">
          أنشئ حسابك وابدأ رحلة التعلم
        </p>

        <div class="field">

          <label>الاسم الكامل</label>

          <div class="input-box">

            <span>👤</span>

            <input
              type="text"
              id="fullName"
              placeholder="أدخل اسمك الكامل"
              autocomplete="name"
            >

          </div>

        </div>

        <div class="field">

          <label>البريد الإلكتروني</label>

          <div class="input-box">

            <span>✉️</span>

            <input
              type="email"
              id="email"
              placeholder="example@email.com"
              autocomplete="email"
            >

          </div>

        </div>

        <div class="field">

          <label>كلمة المرور</label>

          <div class="input-box">

            <span>🔒</span>

            <input
              type="password"
              id="password"
              placeholder="أنشئ كلمة مرور قوية"
              autocomplete="new-password"
            >

          </div>

        </div>

        <div class="field">

          <label>تأكيد كلمة المرور</label>

          <div class="input-box">

            <span>🔐</span>

            <input
              type="password"
              id="confirmPassword"
              placeholder="أعد كتابة كلمة المرور"
              autocomplete="new-password"
            >

          </div>

        </div>

        <button
          class="submit-btn"
          id="signupButton"
          type="button"
          onclick="signupUser()"
        >
          إنشاء الحساب
        </button>

        <div class="bottom-text">

          لديك حساب بالفعل؟

          <button onclick="showLogin()">
            تسجيل الدخول
          </button>

        </div>

      </div>

    </section>

    <a href="index.html" class="home-link">
      ← العودة إلى الصفحة الرئيسية
    </a>

  </main>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* ==========================================
       إعداد Supabase
    ========================================== */

    const SUPABASE_URL =
      "https://lvmbkswqnarxhsjzsvnk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Tb5oOzrsw4UnnS649Mrd8A_9n4mEqmB";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* ==========================================
       تبديل النماذج
    ========================================== */

    function showLogin() {

      document
        .getElementById("loginForm")
        .classList.remove("hidden");

      document
        .getElementById("signupForm")
        .classList.add("hidden");

      document
        .getElementById("loginTab")
        .classList.add("active");

      document
        .getElementById("signupTab")
        .classList.remove("active");

      clearMessage();
    }


    function showSignup() {

      document
        .getElementById("signupForm")
        .classList.remove("hidden");

      document
        .getElementById("loginForm")
        .classList.add("hidden");

      document
        .getElementById("signupTab")
        .classList.add("active");

      document
        .getElementById("loginTab")
        .classList.remove("active");

      clearMessage();
    }


    /* ==========================================
       الرسائل
    ========================================== */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;
    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      message.textContent = "";

      message.className = "message";
    }


    /* ==========================================
       إنشاء حساب
    ========================================== */

    async function signupUser() {

      clearMessage();

      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;

      const button =
        document.getElementById("signupButton");


      /* التحقق من البيانات */

      if (!fullName) {

        showMessage(
          "يرجى إدخال الاسم الكامل.",
          "error"
        );

        return;
      }


      if (!email) {

        showMessage(
          "يرجى إدخال البريد الإلكتروني.",
          "error"
        );

        return;
      }


      if (password.length < 6) {

        showMessage(
          "كلمة المرور يجب أن تحتوي على 6 أحرف على الأقل.",
          "error"
        );

        return;
      }


      if (password !== confirmPassword) {

        showMessage(
          "كلمتا المرور غير متطابقتين.",
          "error"
        );

        return;
      }


      /* تعطيل الزر أثناء العملية */

      button.disabled = true;
      button.textContent = "جاري إنشاء الحساب...";


      try {

        const {
  data,
  error
} = await supabaseClient.auth.signUp({

  email: email,

  password: password,

  options: {

    emailRedirectTo:
      "https://ilmbila-hodod.github.io/ilmbila-hodod/index.html",

    data: {

      full_name: fullName

    }

  }

});
          
          
        

          

          

          

            

              

            

          

        


        if (error) {

          throw error;

        }


        /*
          إذا كان تأكيد البريد الإلكتروني مفعلاً
          فلن تكون هناك جلسة مباشرة.
        */

        if (!data.session) {

          showMessage(
            "تم إنشاء الحساب بنجاح. تحقق من بريدك الإلكتروني لتأكيد الحساب.",
            "success"
          );

        } else {

          showMessage(
            "تم إنشاء حسابك بنجاح! سيتم تحويلك الآن...",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 1200);

        }

      } catch (error) {

        console.error(error);

        showMessage(
          getArabicError(error.message),
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "إنشاء الحساب";

      }

    }


    /* ==========================================
       تسجيل الدخول
    ========================================== */

    async function loginUser() {

      clearMessage();

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const button =
        document.getElementById("loginButton");


      if (!email) {

        showMessage(
          "يرجى إدخال البريد الإلكتروني.",
          "error"
        );

        return;
      }


      if (!password) {

        showMessage(
          "يرجى إدخال كلمة المرور.",
          "error"
        );

        return;
      }


      button.disabled = true;
      button.textContent = "جاري تسجيل الدخول...";


      try {

        const {
          data,
          error
        } = await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          throw error;

        }


        showMessage(
          "تم تسجيل الدخول بنجاح! 👋",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 1000);


      } catch (error) {

        console.error(error);

        showMessage(
          getArabicError(error.message),
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "تسجيل الدخول";

      }

    }


    /* ==========================================
       نسيت كلمة المرور
    ========================================== */

    async function forgotPassword() {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();


      if (!email) {

        showMessage(
          "أدخل بريدك الإلكتروني أولاً، ثم اضغط على «نسيت كلمة المرور؟».",
          "error"
        );

        return;
      }


      try {

        const {
          error
        } = await supabaseClient.auth
          .resetPasswordForEmail(email, {

            redirectTo:
              window.location.origin +
              window.location.pathname

          });


        if (error) {

          throw error;

        }


        showMessage(
          "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني.",
          "success"
        );


      } catch (error) {

        console.error(error);

        showMessage(
          getArabicError(error.message),
          "error"
        );

      }

    }


    /* ==========================================
       ترجمة بعض رسائل Supabase
    ========================================== */

    function getArabicError(message) {

      if (!message) {

        return "حدث خطأ غير متوقع. حاول مرة أخرى.";

      }


      const text =
        message.toLowerCase();


      if (
        text.includes("invalid login credentials")
      ) {

        return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      }


      if (
        text.includes("user already registered")
      ) {

        return "هذا البريد الإلكتروني مسجل بالفعل. حاول تسجيل الدخول.";

      }


      if (
        text.includes("password should be at least")
      ) {

        return "كلمة المرور قصيرة جدًا.";

      }


      if (
        text.includes("email not confirmed")
      ) {

        return "يرجى تأكيد بريدك الإلكتروني أولاً.";

      }


      if (
        text.includes("rate limit")
      ) {

        return "تم تجاوز عدد المحاولات. حاول مرة أخرى بعد قليل.";

      }


      return "حدث خطأ: " + message;

    }


    /* ==========================================
       السماح بالضغط على Enter
    ========================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key !== "Enter") {
          return;
        }


        const loginVisible =
          !document
            .getElementById("loginForm")
            .classList.contains("hidden");


        if (loginVisible) {

          loginUser();

        } else {

          signupUser();

        }

      }
    );

  </script>

</body>
  </html>
